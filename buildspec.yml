version: 0.2

env:
  variables:
    IMAGE_TAG: "latest"
AWS_REGION: us-east-1
REPOSITORY_URI: 512138916710.dkr.ecr.us-east-1.amazonaws.com/organic/myrepo
phases:
  install:
    runtime-versions:
      docker: 20
    commands:
      - echo Logging in to Amazon ECR...
      - aws --version
      - $(aws ecr get-login --no-include-email --region $AWS_DEFAULT_REGION)

  pre_build:
    commands:
      - echo Build started on `date`
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REPOSITORY_URI
      
      -/ IMAGE_URI=$AWS_512138916710.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$REPOSITORY_NAME:$IMAGE_TAG
     
  build:
    commands:
      - /docker build -t $REPOSITORY_NAME .
      - /docker tag $REPOSITORY_NAME:latest $IMAGE_URI
      
      - echo Building the Docker image...
     - docker build -t $REPOSITORY_URI:latest .
  post_build:
    commands:
     - echo Pushing the Docker image...
      - docker push $REPOSITORY_URI:latest
      - echo Creating imagedefinitions.json file...
      - printf '[{"name":"organic/myrepo","imageUri":"%s"}]' $REPOSITORY_URI:latest > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
